<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B34"><title>Fresh Keep</title>
<style>
:root{--ink:#0E3B34;--ink2:#14524a;--bg:#F3F7F4;--card:#fff;--tx:#10231f;--mut:#6b7f79;--ok:#1E9E6A;--warn:#F2A20C;--bad:#D6372F;--ln:#e1e9e5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px}
button,input{font:inherit}
.hide{display:none!important}
#auth{min-height:100vh;background:var(--ink);color:#fff;padding:48px 24px;display:flex;flex-direction:column;justify-content:center}
#auth h1{font-size:34px;line-height:1.1;margin:18px 0 8px}
#auth p{color:#a9cfc6;margin-bottom:24px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--warn);display:grid;place-items:center;font-size:28px}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;color:var(--tx);margin-bottom:12px}
#auth input{border:none}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--warn);color:#2b1c00;font-weight:700;font-size:16px}
.link{background:none;border:0;color:#a9cfc6;margin-top:14px;text-decoration:underline;width:100%}
.msg{font-size:14px;margin:8px 0;color:#ffd7a0;min-height:18px}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 70px;border-radius:0 0 28px 28px}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:20px}
.ic{background:var(--ink2);border:0;color:#fff;border-radius:12px;padding:9px 12px;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-48px 16px 0}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;border:2px solid transparent;box-shadow:0 6px 18px rgba(14,59,52,.1)}
.tile b{font-size:28px;display:block}.tile span{font-size:12px;color:var(--mut)}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}.tile.ok b{color:var(--ok)}
.tile.on{border-color:var(--ink)}
#alert{margin:16px;padding:14px;border-radius:14px;background:#fff3dc;border:1px solid #f5d38c;font-size:14px}
#alert.red{background:#fde8e6;border-color:#f3b4af}
.sec{margin:16px}
#q{margin-bottom:8px}
.item{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;border-left:6px solid var(--ok)}
.item.warn{border-color:var(--warn)}.item.bad{border-color:var(--bad)}
.item .i{flex:1;min-width:0}.item h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mut)}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px;background:#dff5ea;color:#12714b;white-space:nowrap}
.warn .chip{background:#fff0cf;color:#8a5a00}.bad .chip{background:#fde0dd;color:#9c1f19}
.x{background:none;border:0;font-size:20px;color:var(--mut);padding:6px}
.empty{text-align:center;color:var(--mut);padding:36px 20px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--warn);color:#2b1c00;border:0;border-radius:30px;padding:16px 22px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
#modal form{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
#modal h2{margin-bottom:14px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px}
#modal .btn{background:var(--ink);color:#fff}
.tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10231f;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20}

html{font-size:16px}
body{padding-bottom:100px}
#app{max-width:980px;margin:0 auto;background:transparent}
header{max-width:980px;margin:0 auto}
#auth{align-items:center}
#auth>*{width:100%;max-width:420px}
#list{display:grid;grid-template-columns:1fr;gap:10px}
#list .item{margin:0}
#list .empty{grid-column:1/-1}
@media(min-width:640px){
 #list{grid-template-columns:1fr 1fr}
 header{border-radius:0 0 32px 32px;padding-left:28px;padding-right:28px}
 .tiles,.sec,#alert{margin-left:24px;margin-right:24px}
 .tiles{gap:16px}
 #modal{align-items:center;justify-content:center}
 #modal form{max-width:460px;border-radius:24px}
}
@media(min-width:1000px){
 #list{grid-template-columns:repeat(3,1fr)}
 #app{max-width:1100px}header{max-width:1100px}
}
@media(max-width:360px){
 .tile b{font-size:22px}.tile span{font-size:11px}
 .ic{padding:8px 9px}.item{padding:12px;gap:8px}.chip{font-size:11px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}

.item{display:block}
.ih{display:flex;gap:10px;align-items:center}
.cat{display:inline-block;font-size:11px;background:#e8f0ed;color:var(--ink);padding:2px 8px;border-radius:10px;margin-top:4px}
.lots{margin-top:10px;border-top:1px dashed var(--ln);padding-top:6px}
.lot{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;gap:6px}
.lot .d{flex:1}.lot .c{font-weight:700}.lot .c.bad{color:var(--bad)}.lot .c.warn{color:#b87500}.lot .c.ok{color:var(--ok)}
.lot .x{font-size:15px;padding:2px 6px}
.meth{display:flex;gap:10px;margin-bottom:12px}
.meth button{flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:700}
.meth button.p{background:var(--ink);color:#fff}
#ocr{font-size:13px;color:var(--ink2);margin-bottom:10px;min-height:16px}
#pv{max-width:100%;max-height:150px;border-radius:12px;margin-bottom:10px}
.dr{display:flex;gap:8px;align-items:center}.dr input{margin-bottom:8px}
.dr .x{margin-bottom:8px}
.hint{font-size:13px;background:#e8f7ef;color:#12714b;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.mini{background:none;border:0;color:var(--ink);font-weight:700;margin-bottom:10px;padding:0}
#modal form{max-height:92vh;overflow:auto}
select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ln);margin-bottom:12px;background:#fff;font:inherit}
</style></head><body>

<section id="auth">
 <div class="logo">📦</div>
 <h1>Nenhum produto perdido por validade.</h1>
 <p>Regista o stock, tira uma foto à data e recebe o alarme antes de perder dinheiro.</p>
 <input id="em" type="email" placeholder="E-mail" autocomplete="email">
 <input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
 <div class="msg" id="am"></div>
 <button class="btn" id="go">Entrar</button>
 <button class="link" id="sw">Ainda não tens conta? Criar conta</button>
 <button class="link" id="rc">Esqueci a palavra-passe</button>
</section>

<main id="app" class="hide">
 <header><div class="top"><b>📦 Fresh Keep</b><div><button class="ic" id="bell">🔔</button><button class="ic" id="out">Sair</button></div></div></header>
 <div class="tiles">
  <button class="tile bad" data-f="bad"><b id="nb">0</b><span>Expirados</span></button>
  <button class="tile warn" data-f="warn"><b id="nw">0</b><span>A vencer</span></button>
  <button class="tile ok" data-f="ok"><b id="no">0</b><span>Em dia</span></button>
 </div>
 <div id="alert" class="hide"></div>
 <div class="sec"><input id="q" placeholder="Pesquisar produto..."><div id="list"></div></div>
 <button class="fab" id="add">+ Produto</button>
</main>

<div id="modal" class="hide"><form id="f">
 <h2>Adicionar produto</h2>
 <div class="meth"><button type="button" id="mw" class="p">✍️ Escrever</button><button type="button" id="mp">📷 Foto da data</button></div>
 <input type="file" id="file" accept="image/*" capture="environment" class="hide">
 <img id="pv" class="hide" alt="">
 <div id="ocr"></div>
 <label>Nome do produto</label><input id="pn" required list="names" placeholder="Ex: Leite 1L" autocomplete="off">
 <datalist id="names"></datalist>
 <div id="ex" class="hint hide"></div>
 <label>Categoria</label><select id="pc"></select>
 <label>Avisar (dias antes)</label><input id="pa" type="number" min="1" value="7" required>
 <label>Datas de validade (podes ter várias)</label>
 <div id="dr"></div>
 <button type="button" class="mini" id="ad">+ Adicionar outra data</button>
 <button class="btn" type="submit">Guardar</button>
 <button class="link" type="button" id="cx" style="color:#6b7f79">Cancelar</button>
</form></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL="https://bdnadnujejtzownmetch.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkbmFkbnVqZWp0em93bm1ldGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzUxNDcsImV4cCI6MjEwODcxMTE0N30.Sm5HJ07-RKBPzdCh1j0PYL6an5INk51SNtbuNtDfqBY";
const $=s=>document.querySelector(s);
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let user=null,prods=[],lots=[],filter="all",mode="login";
const CATS={"Laticínios":"leite iogurte queijo manteiga nata requeij","Bebidas":"sumo agua água refrigerante cerveja vinho cola juice drink bebida","Enlatados":"conserva atum sardinha lata feijao feijão tomate milho","Carnes e peixe":"carne frango peixe salsicha fiambre linguica chourico","Padaria e cereais":"pao pão farinha arroz massa bolacha cereal biscoito aveia","Medicamentos":"comprimido xarope paracetamol ibuprofeno farmacia farmácia capsula cápsula","Higiene e limpeza":"sabao sabão shampoo champo gel detergente pasta creme lixivia","Molhos e temperos":"oleo óleo molho sal acucar açúcar tempero maionese vinagre ketchup","Doces e snacks":"chocolate snack rebucado rebuçado gelado doce batata"};
const norm=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," ");
const guessCat=t=>{t=norm(t);for(const c in CATS)if(CATS[c].split(" ").some(k=>t.includes(norm(k))))return c;return "Outros"};
$("#pc").innerHTML=[...Object.keys(CATS),"Outros"].map(c=>`<option>${c}</option>`).join("");
const toast=t=>{const e=document.createElement("div");e.className="tt";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=d=>Math.round((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
const fmt=d=>d.split("-").reverse().join("/");
const stL=(l,p)=>{const n=days(l.validade);return n<0?"bad":n<=p.aviso_dias?"warn":"ok"};
const rank={bad:0,warn:1,ok:2};
function view(){return prods.map(p=>{const ls=lots.filter(l=>l.produto_id==p.id).sort((a,b)=>a.validade<b.validade?-1:1);
 const s=ls.length?ls.map(l=>stL(l,p)).sort((a,b)=>rank[a]-rank[b])[0]:"ok";return {p,ls,s}}).sort((a,b)=>rank[a.s]-rank[b.s])}

/* AUTH */
$("#sw").onclick=()=>{mode=mode=="login"?"signup":"login";$("#go").textContent=mode=="login"?"Entrar":"Criar conta";$("#sw").textContent=mode=="login"?"Ainda não tens conta? Criar conta":"Já tenho conta. Entrar";$("#am").textContent=""};
$("#go").onclick=async()=>{const email=$("#em").value.trim(),password=$("#pw").value;
 if(!email||password.length<6){$("#am").textContent="Indica e-mail e palavra-passe (mínimo 6 caracteres).";return}
 $("#am").textContent="A processar...";
 const r=mode=="login"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(r.error){$("#am").textContent="Erro: "+r.error.message;return}
 if(!r.data.session){$("#am").textContent="Conta criada. Confirma o teu e-mail e depois entra.";return}
 start(r.data.session.user)};
$("#rc").onclick=async()=>{const email=$("#em").value.trim();if(!email){$("#am").textContent="Escreve o teu e-mail primeiro.";return}
 const r=await sb.auth.resetPasswordForEmail(email);$("#am").textContent=r.error?"Erro: "+r.error.message:"Enviámos um link de recuperação para o teu e-mail."};
$("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* DADOS */
async function load(){
 const [a,b]=await Promise.all([sb.from("produtos").select("*").order("nome"),sb.from("lotes").select("*").order("validade")]);
 if(a.error||b.error){const c=JSON.parse(localStorage.getItem("fk_cache2")||"{}");prods=c.p||[];lots=c.l||[];
  toast(a.error&&/lotes|relation|does not exist/i.test((b.error||a.error).message)?"Falta correr o SQL novo no Supabase.":"Sem ligação. A mostrar última lista guardada.")}
 else{prods=a.data;lots=b.data;localStorage.setItem("fk_cache2",JSON.stringify({p:prods,l:lots}))}
 $("#names").innerHTML=prods.map(p=>`<option value="${esc(p.nome)}">`).join("");
 render();check(false)}
function render(){
 const v=view(),c={bad:0,warn:0,ok:0};v.forEach(x=>c[x.s]++);
 $("#nb").textContent=c.bad;$("#nw").textContent=c.warn;$("#no").textContent=c.ok;
 document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("on",t.dataset.f==filter));
 const q=norm($("#q").value);
 const l=v.filter(x=>(filter=="all"||x.s==filter)&&norm(x.p.nome).includes(q));
 $("#list").innerHTML=l.length?l.map(({p,ls,s})=>{
  const first=ls[0],n=first?days(first.validade):null;
  const t=first?(n<0?`Expirou há ${-n} d`:n==0?"Vence hoje":`Faltam ${n} d`):"Sem datas";
  return `<div class="item ${s}"><div class="ih"><div class="i"><h3>${esc(p.nome)}</h3><span class="cat">${esc(p.categoria||"Outros")}</span></div><span class="chip">${t}</span><button class="x" onclick="delP('${p.id}')">🗑</button></div>
  <div class="lots">${ls.map(x=>{const k=stL(x,p),d=days(x.validade);return `<div class="lot"><span class="d">${x.quantidade} un. · ${fmt(x.validade)}</span><span class="c ${k}">${d<0?"expirado":d==0?"hoje":d+" d"}</span><button class="x" onclick="delL('${x.id}')">✕</button></div>`}).join("")}</div></div>`}).join("")
  :`<div class="empty">${prods.length?"Nada nesta lista.":"Ainda não tens produtos.<br>Toca em <b>+ Produto</b> para registar o primeiro."}</div>`;
 const a=$("#alert");
 if(c.bad||c.warn){a.className=c.bad?"red":"";a.innerHTML=(c.bad?`<b>${c.bad} produto(s) com lotes expirados.</b> Retira-os do stock. `:"")+(c.warn?`<b>${c.warn} a vencer em breve.</b> Vende ou usa primeiro.`:"")}else a.className="hide"}
document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{filter=filter==t.dataset.f?"all":t.dataset.f;render()});
$("#q").oninput=render;

/* FORMULÁRIO */
function row(d="",q=1){const r=document.createElement("div");r.className="dr";
 r.innerHTML=`<input type="date" required value="${d}" style="flex:2"><input type="number" min="1" value="${q}" required style="flex:1" aria-label="Quantidade"><button type="button" class="x">✕</button>`;
 r.querySelector("button").onclick=()=>{if($("#dr").children.length>1)r.remove()};$("#dr").append(r)}
function reset(){$("#f").reset();$("#dr").innerHTML="";row();$("#pa").value=7;$("#ocr").textContent="";$("#pv").classList.add("hide");$("#ex").classList.add("hide")}
$("#add").onclick=()=>{reset();$("#modal").classList.remove("hide")};
$("#cx").onclick=()=>$("#modal").classList.add("hide");
$("#ad").onclick=()=>row();
$("#mw").onclick=()=>{$("#pn").focus()};
$("#mp").onclick=()=>$("#file").click();
function hint(){const n=norm($("#pn").value),e=prods.find(p=>norm(p.nome)==n);
 const h=$("#ex");if(e&&n){h.textContent="Este produto já existe. As novas datas serão juntadas a ele, sem duplicar.";h.classList.remove("hide");$("#pc").value=e.categoria||"Outros"}else h.classList.add("hide")}
$("#pn").oninput=()=>{hint();const e=prods.find(p=>norm(p.nome)==norm($("#pn").value));if(!e)$("#pc").value=guessCat($("#pn").value)};

/* FOTO + OCR */
const MES={jan:1,fev:2,feb:2,mar:3,abr:4,apr:4,mai:5,may:5,jun:6,jul:7,ago:8,aug:8,set:9,sep:9,out:10,oct:10,nov:11,dez:12,dec:12};
function parseDates(t){
 t=t.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,"0");const out=new Set(),now=new Date(),lo=new Date(now.getFullYear()-2,0,1),hi=new Date(now.getFullYear()+10,0,1);
 const add=(d,m,y)=>{y=+y;if(y<100)y+=2000;d=+d;m=+m;const dt=new Date(y,m-1,d);
  if(m<1||m>12||d<1||dt.getMonth()!=m-1||dt<lo||dt>hi)return;out.add(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`)};
 let r=t;
 r=r.replace(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})\b/g,(x,d,m,y)=>{add(d,m,y);return " "});
 r=r.replace(/(\d{1,2})\s*([A-Za-zÇç]{3})[A-Za-zç]*\s*[\/\-.]?\s*(\d{4}|\d{2})\b/g,(x,d,m,y)=>{const k=MES[m.toLowerCase()];if(k)add(d,k,y);return " "});
 r.replace(/\b(\d{1,2})\s*[\/\-.]\s*(\d{4})\b/g,(x,m,y)=>{if(+m>=1&&+m<=12)add(new Date(+y,+m,0).getDate(),m,y)});
 return [...out].sort()}
function guessName(t){
 const ls=t.split(/\n/).map(x=>x.replace(/[^A-Za-zÀ-ÿ0-9 .\-]/g,"").trim()).filter(x=>(x.match(/[A-Za-zÀ-ÿ]/g)||[]).length>=3&&!/\d{1,2}\s*[\/\-.]\s*\d/.test(x)&&!/^(val|exp|lote|lot|fab|best|cons)/i.test(x));
 return ls[0]||""}
function prep(img){return new Promise(res=>{const m=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
 c.width=img.width*m;c.height=img.height*m;const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.4)";x.drawImage(img,0,0,c.width,c.height);res(c)})}
function loadTess(){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement("script");
 s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=()=>no(new Error("Sem internet para carregar o leitor."));document.head.append(s)})}
$("#file").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);$("#pv").src=url;$("#pv").classList.remove("hide");
 $("#ocr").textContent="A preparar a leitura...";
 try{
  await loadTess();const img=new Image();img.src=url;await img.decode();const cv=await prep(img);
  const w=await Tesseract.createWorker("por",1,{logger:m=>{if(m.status=="recognizing text")$("#ocr").textContent="A ler a imagem... "+Math.round(m.progress*100)+"%"}});
  const {data:{text}}=await w.recognize(cv);await w.terminate();
  const ds=parseDates(text.split("\n").filter(x=>!/\b(fab|prod|mfg|manuf)/i.test(x)).join("\n")),nm=guessName(text);
  if(nm&&!$("#pn").value){$("#pn").value=nm;$("#pn").oninput()}
  $("#pc").value=guessCat(($("#pn").value||"")+" "+text);hint();
  if(ds.length){$("#dr").innerHTML="";ds.forEach(d=>row(d));$("#ocr").textContent=`Encontrei ${ds.length} data(s). Confirma antes de guardar.`}
  else $("#ocr").textContent="Não consegui ler a data. Escreve-a manualmente ou tira outra foto com mais luz."
 }catch(err){$("#ocr").textContent="Erro na leitura: "+err.message}
 e.target.value=""};

/* GUARDAR */
$("#f").onsubmit=async e=>{e.preventDefault();
 const nome=$("#pn").value.trim(),cat=$("#pc").value,aviso=+$("#pa").value;
 const rows=[...$("#dr").children].map(r=>({validade:r.children[0].value,quantidade:+r.children[1].value})).filter(r=>r.validade);
 if(!rows.length){toast("Indica pelo menos uma data.");return}
 const m=new Map();rows.forEach(r=>m.set(r.validade,(m.get(r.validade)||0)+r.quantidade));
 let p=prods.find(x=>norm(x.nome)==norm(nome));
 if(!p){const r=await sb.from("produtos").insert({user_id:user.id,nome,categoria:cat,aviso_dias:aviso}).select().single();
  if(r.error){toast("Erro: "+r.error.message);return}p=r.data}
 for(const [validade,q] of m){
  const ex=lots.find(l=>l.produto_id==p.id&&l.validade==validade);
  const r=ex?await sb.from("lotes").update({quantidade:ex.quantidade+q}).eq("id",ex.id):await sb.from("lotes").insert({user_id:user.id,produto_id:p.id,quantidade:q,validade});
  if(r.error){toast("Erro: "+r.error.message);return}}
 $("#modal").classList.add("hide");toast("Guardado");load()};
async function delP(id){if(!confirm("Remover este produto e todas as suas datas?"))return;
 const r=await sb.from("produtos").delete().eq("id",id);r.error?toast("Erro: "+r.error.message):load()}
async function delL(id){if(!confirm("Remover esta data?"))return;
 const r=await sb.from("lotes").delete().eq("id",id);r.error?toast("Erro: "+r.error.message):load()}

/* ALARME */
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.18)})}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300])}
function check(ring){const v=view(),b=v.filter(x=>x.s=="bad").length,w=v.filter(x=>x.s=="warn").length;
 if(!b&&!w)return;const today=new Date().toDateString();
 if(!ring&&localStorage.getItem("fk_last")==today)return;localStorage.setItem("fk_last",today);beep();
 if("Notification" in window&&Notification.permission=="granted")new Notification("Fresh Keep",{body:`${b} expirado(s) e ${w} a vencer. Abre o app para ver.`})}
$("#bell").onclick=async()=>{
 if("Notification" in window&&Notification.permission=="default"){const p=await Notification.requestPermission();toast(p=="granted"?"Notificações ativadas":"Notificações bloqueadas")}else toast("Teste de alarme");
 check(true)};
setInterval(()=>check(false),36e5);

function start(u){user=u;$("#auth").classList.add("hide");$("#app").classList.remove("hide");load()}
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
</script></body></html>
