<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B34"><title>Fresh Keep</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--ink:#0E3B34;--ink2:#14524a;--bg:#F3F7F4;--card:#fff;--tx:#10231f;--mut:#6b7f79;--ok:#1E9E6A;--warn:#F2A20C;--bad:#D6372F;--ln:#e1e9e5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:100px}
button,input,select{font:inherit}.hide{display:none!important}
#auth{min-height:100vh;background:var(--ink);color:#fff;padding:48px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#auth>*{width:100%;max-width:420px}
#auth h1{font-size:34px;line-height:1.1;margin:18px 0 8px}#auth p{color:#a9cfc6;margin-bottom:24px}
.logo{width:56px;height:56px;border-radius:16px;background:var(--warn);display:grid;place-items:center;font-size:28px}
input,select{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;color:var(--tx);margin-bottom:12px}
#auth input{border:none}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--warn);color:#2b1c00;font-weight:700;font-size:16px}
.link{background:none;border:0;color:#a9cfc6;margin-top:14px;text-decoration:underline;width:100%}
.msg{font-size:14px;margin:8px 0;color:#ffd7a0;min-height:18px}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 70px;border-radius:0 0 28px 28px;max-width:1100px;margin:0 auto}
header.s{padding-bottom:26px}
.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px}
.ic{background:var(--ink2);border:0;color:#fff;border-radius:12px;padding:9px 12px;margin-left:6px}
#app{max-width:1100px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-48px 16px 0}
.tile{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;border:2px solid transparent;box-shadow:0 6px 18px rgba(14,59,52,.1)}
.tile b{font-size:28px;display:block}.tile span{font-size:12px;color:var(--mut)}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}.tile.ok b{color:var(--ok)}.tile.on{border-color:var(--ink)}
#alert{margin:16px;padding:14px;border-radius:14px;background:#fff3dc;border:1px solid #f5d38c;font-size:14px}
#alert.red{background:#fde8e6;border-color:#f3b4af}
.sec{margin:16px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.grid .empty{grid-column:1/-1}
.item{background:var(--card);border-radius:16px;padding:14px;border-left:6px solid var(--ok)}
.item.warn{border-color:var(--warn)}.item.bad{border-color:var(--bad)}
.ih{display:flex;gap:10px;align-items:center}
.i{flex:1;min-width:0}.item h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat{display:inline-block;font-size:11px;background:#e8f0ed;color:var(--ink);padding:2px 8px;border-radius:10px;margin-top:4px}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px;background:#dff5ea;color:#12714b;white-space:nowrap}
.warn .chip,.chip.w{background:#fff0cf;color:#8a5a00}.bad .chip,.chip.b{background:#fde0dd;color:#9c1f19}
.x{background:none;border:0;font-size:20px;color:var(--mut);padding:6px}
.lots{margin-top:10px;border-top:1px dashed var(--ln);padding-top:6px}
.lot{display:flex;align-items:center;font-size:13px;padding:4px 0;gap:6px}.lot .d{flex:1}.lot .c{font-weight:700}
.c.bad{color:var(--bad)}.c.warn{color:#b87500}.c.ok{color:var(--ok)}.lot .x{font-size:15px;padding:2px 6px}
.empty{text-align:center;color:var(--mut);padding:36px 20px}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);background:var(--warn);color:#2b1c00;border:0;border-radius:30px;padding:16px 22px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:9}
.mdl form{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:92vh;overflow:auto}
.mdl h2{margin-bottom:14px}.mdl .btn{background:var(--ink);color:#fff}
label{font-size:13px;color:var(--mut)}.row{display:flex;gap:10px}
.meth{display:flex;gap:10px;margin-bottom:12px}.meth.c{flex-direction:column}
.meth button{flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:700}
.meth button.p{background:var(--ink);color:#fff}
#ocr{font-size:13px;color:var(--ink2);margin-bottom:10px;min-height:16px}#pv{max-width:100%;max-height:150px;border-radius:12px;margin-bottom:10px}
.dr{display:flex;gap:8px;align-items:center}.dr input{margin-bottom:8px}.dr .x{margin-bottom:8px}
.hint{font-size:13px;background:#e8f7ef;color:#12714b;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.mini{background:none;border:0;color:var(--ink);font-weight:700;margin-bottom:10px;padding:0}
.fr{display:flex;gap:8px;margin-bottom:10px}.fr input,.fr select{margin:0}.fr input{flex:1;min-width:0}.fr select{width:auto;max-width:42%}
.fr label{flex:1;font-size:12px;color:var(--mut)}.fr label input{display:block;margin-top:2px}
.fr button{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
nav button{flex:1;border:0;background:none;padding:9px 4px;color:var(--mut);font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ink);font-weight:700}
.seg{display:flex;background:#e1e9e5;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--mut)}.seg button.on{background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stats div{background:#fff;border-radius:16px;padding:14px;text-align:center}.stats b{display:block;font-size:26px}.stats span{font-size:12px;color:var(--mut)}
.day{background:#e7f0ed;border-radius:10px;padding:8px 12px;margin:14px 0 6px;font-weight:700;display:flex;justify-content:space-between;font-size:14px}.day span{font-weight:400;color:var(--mut);font-size:12px}
.rr{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;font-size:14px}
.rr b{color:var(--ink2);font-size:13px;flex:none}.rr .n{flex:1;min-width:0}.rr small{color:var(--mut);display:block}.rr .q{text-align:right;font-size:12px;color:var(--mut);flex:none}
.abox{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}.abox h3{margin-bottom:10px;font-size:15px}.abox p{font-size:13px;color:var(--mut);margin-bottom:10px}
.tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10231f;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
#net,#upd{position:fixed;left:12px;right:12px;z-index:25;border-radius:14px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:10px}
#net{top:calc(env(safe-area-inset-top,0px) + 8px);background:#10231f;color:#fff;justify-content:center;text-align:center}
#upd{bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--warn);color:#2b1c00;font-weight:700}
#upd button{margin-left:auto;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;flex:none}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.tiles,.sec,#alert{margin-left:24px;margin-right:24px}.stats{grid-template-columns:repeat(4,1fr)}.mdl{align-items:center;justify-content:center}.mdl form{max-width:460px;border-radius:24px}header{padding-left:28px;padding-right:28px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:360px){.tile b{font-size:22px}.tile span{font-size:11px}.ic{padding:8px 9px}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.cards{display:grid;gap:12px;margin-bottom:14px}
.mc{background:#fff;border:0;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:0 6px 18px rgba(14,59,52,.08);color:var(--tx)}
.mc .mi{font-size:30px}.mc b{font-size:16px}.mc small{color:var(--mut);font-size:13px}
.tiles2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.tiles2 .tile{box-shadow:none;border:2px solid transparent}.tiles2 .tile.on{border-color:var(--ink)}
.pre{margin:-4px 0 12px}.pre button{background:#e8f0ed;color:var(--ink);font-size:13px;padding:9px 0;flex:1;border-radius:10px}
.tr{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.tr .n{flex:1;min-width:0}.tr small{display:block;color:var(--mut);font-size:12px}.tr .q{font-weight:700;color:var(--ink2);white-space:nowrap}
@media(min-width:640px){.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div id="net" class="hide"></div>
<div id="upd" class="hide"><span id="updt"></span><button id="updb">Atualizar</button></div>

<section id="auth">
 <div class="logo">📦</div>
 <h1>Fresh Keep</h1>
 <p id="ap"></p>
 <input id="em" type="email" placeholder="E-mail" autocomplete="username">
 <input id="pw" type="password" placeholder="Palavra-passe" autocomplete="current-password">
 <div class="msg" id="am"></div>
 <button class="btn" id="go">Entrar</button>
 <button class="link" id="rc">Esqueci a palavra-passe</button>
 <button class="link" id="tc">Testar ligação ao servidor</button>
</section>

<main id="app" class="hide">
 <header id="hd"><div class="top"><b>📦 Fresh Keep</b><div><button class="ic" id="bell" title="Alarme">🔔</button><button class="ic" id="gset" title="Definições">⚙️</button><button class="ic" id="lk" title="Bloquear">🔒</button></div></div></header>

 <div id="pg-home" class="sec">
  <div class="cards">
   <button class="mc" data-go="prod"><span class="mi">📦</span><b>Controle de validade de produtos</b><small id="hp"></small></button>
   <button class="mc" data-go="tr"><span class="mi">🔁</span><b>Transferência de produtos</b><small id="ht"></small></button>
   <button class="mc" data-go="doc"><span class="mi">📄</span><b>Controle de documentos</b><small id="hdc"></small></button>
  </div>
  <div id="hs" class="stats"></div>
 </div>

 <div id="pg-prod" class="hide">
  <div class="tiles">
   <button class="tile bad" data-f="bad"><b id="nb">0</b><span>Expirados</span></button>
   <button class="tile warn" data-f="warn"><b id="nw">0</b><span>A vencer</span></button>
   <button class="tile ok" data-f="ok"><b id="no">0</b><span>Em dia</span></button>
  </div>
  <div id="alert" class="hide"></div>
  <div class="sec"><div class="fr"><input id="q" placeholder="Pesquisar produto..."><select id="fc"></select></div>
   <div class="fr"><label>Validade de<input type="date" id="pd1"></label><label>até<input type="date" id="pd2"></label></div>
   <div class="meth"><button class="p" id="ppdf">📄 Gerar relatório PDF</button></div><div id="list" class="grid"></div></div>
 </div>

 <div id="pg-doc" class="sec hide">
  <div id="dstats" class="tiles2"></div>
  <div class="fr"><input id="dq" placeholder="Pesquisar documento..."></div>
  <div class="fr"><label>Expira de<input type="date" id="dd1"></label><label>até<input type="date" id="dd2"></label></div>
  <div class="meth"><button class="p" id="dpdf">📄 Gerar relatório de documentos</button></div>
  <div id="dlist" class="grid"></div>
 </div>

 <div id="pg-tr" class="sec hide">
  <div class="seg"><button id="tt1" class="on">Transferências</button><button id="tt2">Pontos</button></div>
  <div id="tv1">
   <div class="fr"><input id="tq" placeholder="Pesquisar produto..."></div>
   <div class="fr"><select id="tfo" style="max-width:none;flex:1"></select><select id="tfd" style="max-width:none;flex:1"></select></div>
   <div class="fr"><label>De<input type="date" id="tf1"></label><label>Até<input type="date" id="tf2"></label></div>
   <div id="ts" class="stats"></div>
   <div class="meth"><button class="p" id="tpdf">📄 Gerar relatório de transferências</button></div>
   <div id="tl"></div>
  </div>
  <div id="tv2" class="hide"><div class="fr"><input id="pq" placeholder="Pesquisar ponto..."></div><div id="pl"></div></div>
 </div>

 <div id="pg-rep" class="sec hide">
  <div class="seg"><button id="rt1" class="on">Cadastros</button><button id="rt2">Validades</button><button id="rt3">Documentos</button></div>
  <div class="fr" id="rf"><label>De<input type="date" id="rd1"></label><label>Até<input type="date" id="rd2"></label></div>
  <div id="rs" class="stats"></div>
  <div class="meth"><button class="p" id="rpdf">📄 Gerar PDF</button><button id="rwa">💬 WhatsApp</button></div>
  <div id="rl"></div>
 </div>

 <div id="pg-set" class="sec hide">
  <div class="abox"><h3>🏢 Empresa</h3><p>O nome aparece no topo de todos os PDF.</p><input id="emp" placeholder="Nome da empresa"></div>
  <div class="abox"><h3>🏷 Categorias</h3><p>Só tu crias as categorias. Nada é preenchido automaticamente.</p><div id="cl"></div><div class="fr" style="margin-top:8px"><input id="cn" placeholder="Nova categoria (ex: Laticínios)"><button id="ca">+</button></div></div>
  <div class="abox"><h3>🔑 Alterar palavra-passe</h3>
   <input id="p0" type="password" placeholder="Palavra-passe atual" autocomplete="current-password">
   <input id="p1" type="password" placeholder="Nova palavra-passe (mín. 6)" autocomplete="new-password">
   <input id="p2" type="password" placeholder="Repete a nova palavra-passe" autocomplete="new-password">
   <button class="btn" id="pwb" style="background:var(--ink);color:#fff">Guardar nova palavra-passe</button></div>
  <div class="abox"><h3>🔄 Sincronização e versão</h3><p id="sy"></p><div class="meth"><button id="sn">Sincronizar agora</button><button id="cu">Verificar atualização</button></div></div>
  <div class="abox"><button class="btn" id="so" style="background:#fde0dd;color:#9c1f19">Terminar sessão</button></div>
 </div>

 <button class="fab" id="add">+ Produto</button>
 <nav><button data-p="home"><b>🏠</b>Início</button><button data-p="prod"><b>📦</b>Produtos</button><button data-p="doc"><b>📄</b>Documentos</button><button data-p="tr"><b>🔁</b>Transf.</button><button data-p="rep"><b>📊</b>Relatórios</button></nav>
</main>

<div id="modal" class="mdl hide"><form id="f">
 <h2>Adicionar produto</h2>
 <div class="meth"><button type="button" id="mw" class="p">✍️ Escrever</button><button type="button" id="mp">📷 Foto da data</button></div>
 <input type="file" id="file" accept="image/*" capture="environment" class="hide">
 <img id="pv" class="hide" alt=""><div id="ocr"></div>
 <label>Nome do produto</label><input id="pn" required list="names" placeholder="Ex: Leite 1L" autocomplete="off"><datalist id="names"></datalist>
 <div id="ex" class="hint hide"></div>
 <label>Categoria <button type="button" class="mini" id="nc" style="margin:0 0 0 8px">+ Nova</button></label><select id="pc"></select>
 <label>Avisar (dias antes de vencer)</label><input id="pa" type="number" min="1" max="365" value="7" required>
 <div class="fr pre" data-t="pa"><button type="button" data-v="30">30 d</button><button type="button" data-v="15">15 d</button><button type="button" data-v="7">7 d</button><button type="button" data-v="1">1 d</button></div>
 <label>Datas de validade e quantidades</label><div id="dr"></div>
 <button type="button" class="mini" id="ad">+ Adicionar outra data</button>
 <button class="btn" type="submit">Guardar</button>
 <button class="link" type="button" id="cx" style="color:#6b7f79">Cancelar</button>
</form></div>

<div id="tmodal" class="mdl hide"><form id="tfm">
 <h2 id="ttm">Nova transferência</h2>
 <label>Ponto de origem</label><select id="tor" required></select>
 <label>Ponto de destino</label><select id="tde" required></select>
 <label>Nome do produto</label><input id="tpr" required list="tnames" placeholder="Ex: Leite 1L" autocomplete="off"><datalist id="tnames"></datalist>
 <label>Quantidade transferida</label><input id="tqt" type="number" min="0.01" step="any" required inputmode="decimal">
 <label>Data da transferência</label><input id="tdt" type="date" required>
 <button class="btn" type="submit">Guardar</button>
 <button class="link" type="button" id="tcx" style="color:#6b7f79">Cancelar</button>
</form></div>

<div id="dmodal" class="mdl hide"><form id="dfm">
 <h2 id="dmt">Novo documento</h2>
 <label>Nome do documento</label><input id="dnm" required placeholder="Ex: Alvará comercial, Certidão, Licença..." autocomplete="off">
 <label>Data de validade (expiração)</label><input id="dval" type="date" required>
 <label>Avisar (dias antes de expirar)</label><input id="dav" type="number" min="1" max="365" value="30" required>
 <div class="fr pre" data-t="dav"><button type="button" data-v="30">30 d</button><button type="button" data-v="15">15 d</button><button type="button" data-v="7">7 d</button><button type="button" data-v="1">1 d</button></div>
 <label>Observação (opcional)</label><input id="dobs" placeholder="Ex: Empresa X, nº do documento" autocomplete="off">
 <button class="btn" type="submit">Guardar</button>
 <button class="link" type="button" id="dcx" style="color:#6b7f79">Cancelar</button>
</form></div>

<div id="pm" class="mdl hide" style="z-index:20"><form onsubmit="return false">
 <h2>📄 PDF pronto</h2><p id="pmn" style="color:var(--mut);margin-bottom:12px;word-break:break-all"></p>
 <div class="meth c"><button type="button" class="p" id="pms">⬇️ Guardar no telemóvel</button><button type="button" id="pmh">📤 Partilhar no WhatsApp</button></div>
 <button class="link" type="button" id="pmx" style="color:#6b7f79">Fechar</button>
</form></div>

<div id="dlg" class="mdl hide" style="z-index:30"><form id="df">
 <h2 id="dt"></h2><p id="dm" style="margin-bottom:12px;color:var(--mut)"></p><input id="di" class="hide">
 <div class="row"><button type="button" class="btn" id="dn" style="background:#e1e9e5;color:var(--ink)">Cancelar</button><button class="btn" type="submit">OK</button></div>
</form></div>

<div id="recov" class="mdl hide" style="z-index:35"><form id="rf2">
 <h2>Nova palavra-passe</h2>
 <input id="r1" type="password" placeholder="Nova palavra-passe (mín. 6)" autocomplete="new-password">
 <input id="r2" type="password" placeholder="Repete a palavra-passe" autocomplete="new-password">
 <div id="rm" style="color:var(--bad);font-size:14px;min-height:18px;margin-bottom:8px"></div>
 <button class="btn" type="submit">Guardar</button>
</form></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let me={},page="home",filter="all",rtab=1,trTab=1,docFilter="all",outbox=JSON.parse(localStorage.getItem("fk_out")||"[]"),syncing=false,hiddenAt=0;

const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const tkey=d=>{d=new Date(d);return pad(d.getHours())+":"+pad(d.getMinutes())};
const days=d=>Math.round((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
const fmt=d=>d?String(d).split("-").reverse().join("/"):"";
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=="x"?r:(r&3|8)).toString(16)}));
const isNet=m=>/failed to fetch|network|load failed|fetch/i.test(m||"");
const stL=(l,p)=>{const n=days(l.validade);return n<0?"bad":n<=p.aviso_dias?"warn":"ok"};

/* OFFLINE + SINCRONIZAÇÃO */
function saveLocal(){try{localStorage.setItem("fk_c5",JSON.stringify(S));localStorage.setItem("fk_out",JSON.stringify(outbox))}catch(e){}}
function fromCache(){try{const k=JSON.parse(localStorage.getItem("fk_c5")||"null");if(k)Object.keys(S).forEach(t=>S[t]=k[t]||[])}catch(e){}}
function netUI(){const e=$("#net"),o=!navigator.onLine,n=outbox.length;
 e.textContent=o?"Sem internet. A trabalhar offline"+(n?` · ${n} alteração(ões) por enviar`:""):(n?`A sincronizar ${n} alteração(ões)...`:"");e.classList.toggle("hide",!(o||n));if(page=="set")renderSet()}
function apply(tb,op,row){const a=S[tb];
 if(op=="insert")a.push(row);else if(op=="update"){const x=a.find(i=>i.id==row.id);if(x)Object.assign(x,row)}
 else{const k=a.findIndex(i=>i.id==row.id);if(k>=0)a.splice(k,1);if(tb=="produtos")S.lotes=S.lotes.filter(l=>l.produto_id!=row.id)}}
async function mut(tb,op,row){apply(tb,op,row);outbox.push({tb,op,row:{...row}});saveLocal();netUI();renderAll();flush()}
async function flush(){if(syncing||!outbox.length||!navigator.onLine||!me.id)return;syncing=true;let done=false;
 try{while(outbox.length){const o=outbox[0];let r;
  if(o.op=="insert")r=await sb.from(o.tb).insert(o.row);
  else if(o.op=="update"){const {id,...p}=o.row;r=await sb.from(o.tb).update(p).eq("id",id)}
  else r=await sb.from(o.tb).delete().eq("id",o.row.id);
  if(r.error){if(isNet(r.error.message))break;if(!/duplicate key|23505/i.test(r.error.message))toast("Não foi possível sincronizar: "+r.error.message)}
  outbox.shift();saveLocal();netUI();done=true}}catch(e){}
 syncing=false;netUI();if(done&&!outbox.length)load()}
async function load(){
 if(outbox.length&&navigator.onLine&&!syncing){await flush();if(!outbox.length)return}
 if(outbox.length||!navigator.onLine){fromCache();renderAll();check(false);netUI();return}
 const T=["produtos","lotes","categorias","registos","documentos","pontos","transferencias"];
 const rs=await Promise.all(T.map(t=>t=="registos"?sb.from(t).select("*").order("created_at",{ascending:false}).limit(1000):sb.from(t).select("*").order("created_at")));
 const er=rs.find(r=>r.error);
 if(er){fromCache();toast(isNet(er.error.message)?"Sem ligação ao servidor. A mostrar os dados guardados.":"Erro: "+er.error.message+" (corre o SQL no Supabase)")}
 else{T.forEach((t,i)=>S[t]=rs[i].data);saveLocal()}
 renderAll();check(false);netUI()}

/* ACESSO: um único administrador */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function setHash(pw){try{let s=localStorage.getItem("fk_salt");if(!s){s=uid();localStorage.setItem("fk_salt",s)}localStorage.setItem("fk_h",await sha(s+pw))}catch(e){}}
async function checkHash(pw){try{const s=localStorage.getItem("fk_salt"),h=localStorage.getItem("fk_h");return !!(s&&h&&h===await sha(s+pw))}catch(e){return false}}
function showAuth(lock){$("#app").classList.add("hide");$("#auth").classList.remove("hide");$("#pw").value="";$("#am").textContent="";
 $("#ap").textContent=lock?"Aplicação bloqueada. Introduz a palavra-passe para continuar.":"Controlo de stock e validades. Acesso reservado ao administrador."}
$("#pw").addEventListener("keydown",e=>{if(e.key=="Enter")$("#go").click()});
$("#go").onclick=async()=>{const email=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,m=$("#am");
 if(!email||!pw){m.textContent="Indica o e-mail e a palavra-passe.";return}
 if(email!==ADMIN_EMAIL){m.textContent="Acesso reservado ao administrador.";return}
 m.textContent="A entrar...";
 if(navigator.onLine){let r;try{r=await sb.auth.signInWithPassword({email,password:pw})}catch(x){r={error:x}}
  if(!r.error){await setHash(pw);return start(r.data.user)}
  const t=r.error.message||"";
  if(!isNet(t)){m.textContent=/invalid login/i.test(t)?"E-mail ou palavra-passe errados.":/not confirmed/i.test(t)?"O e-mail ainda não foi confirmado no Supabase.":"Erro: "+t;return}}
 if(localStorage.getItem("fk_email")==email&&localStorage.getItem("fk_uid")&&await checkHash(pw))return start({id:localStorage.getItem("fk_uid"),email});
 m.textContent=localStorage.getItem("fk_h")?"Sem ligação ao servidor, ou palavra-passe errada.":"Sem internet. A primeira entrada precisa de internet."};

 if((u.email||"").toLowerCase()!==ADMIN_EMAIL){try{await sb.auth.signOut()}catch(e){}$("#am").textContent="Acesso reservado ao administrador.";return}
 me={id:u.id,email:u.email.toLowerCase()};localStorage.setItem("fk_uid",me.id);localStorage.setItem("fk_email",me.email);
 $("#auth").classList.add("hide");$("#app").classList.remove("hide");$("#am").textContent="";
 fromCache();renderAll();go("home");await load();flush()}

document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&me.id&&Date.now()-hiddenAt>3*60e3&&!$("#app").classList.contains("hide"))showAuth(true);if(!document.hidden)hiddenAt=0});

 if(email!==ADMIN_EMAIL){m.textContent="Escreve o e-mail do administrador.";return}
 if(!navigator.onLine){m.textContent="Sem internet.";return}
 m.textContent="A enviar...";let r;try{r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname})}catch(x){r={error:x}}
 m.textContent=r.error?(isNet(r.error.message)?"Sem ligação ao servidor.":/rate|seconds|too many/i.test(r.error.message)?"Já pediste há pouco. Espera um minuto e tenta de novo.":"Erro: "+r.error.message):"Enviámos um link para o teu e-mail. Abre-o neste telemóvel e define a nova palavra-passe."};
$("#tc").onclick=async()=>{const m=$("#am");m.textContent="A testar...";

sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){$("#r1").value=$("#r2").value="";$("#rm").textContent="";$("#recov").classList.remove("hide")}});
$("#rf2").onsubmit=async e=>{e.preventDefault();const a=$("#r1").value,b=$("#r2").value,m=$("#rm");
 if(a.length<6){m.textContent="Mínimo de 6 caracteres.";return}if(a!==b){m.textContent="As palavras-passe não coincidem.";return}

 if((u.data.user.email||"").toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut();m.textContent="Acesso reservado ao administrador.";return}
 await setHash(a);history.replaceState(null,"",location.pathname);$("#recov").classList.add("hide");toast("Palavra-passe alterada.");start(u.data.user)};

 if(!navigator.onLine){toast("Precisa de internet.");return}
 if(b.length<6){toast("A nova palavra-passe precisa de 6 ou mais caracteres.");return}if(b!==c){toast("As palavras-passe novas não coincidem.");return}
 const v=await sb.auth.signInWithPassword({email:me.email,password:a});if(v.error){toast(isNet(v.error.message)?"Sem ligação ao servidor.":"A palavra-passe atual está errada.");return}
 const u=await sb.auth.updateUser({password:b});if(u.error){toast("Erro: "+u.error.message);return}

 try{await sb.auth.signOut()}catch(e){}["fk_uid","fk_c5","fk_out","fk_h","fk_last"].forEach(k=>localStorage.removeItem(k));location.reload()};

/* PRODUTOS */
function view(){return S.produtos.map(p=>{const ls=S.lotes.filter(l=>l.produto_id==p.id).sort((a,b)=>a.validade<b.validade?-1:1);
 const s=ls.length?ls.map(l=>stL(l,p)).sort((a,b)=>rank[a]-rank[b])[0]:"ok";return {p,ls,s}}).sort((a,b)=>rank[a.s]-rank[b.s]||a.p.nome.localeCompare(b.p.nome))}
function cardHTML({p,ls,s}){const f=ls[0],n=f?days(f.validade):null;
 const t=f?(n<0?`Expirou há ${-n} d`:n==0?"Vence hoje":`Faltam ${n} d`):"Sem datas";
 return `<div class="item ${s}"><div class="ih"><div class="i"><h3>${esc(p.nome)}</h3>${p.categoria?`<span class="cat">${esc(p.categoria)}</span>`:""}</div><span class="chip">${t}</span><button class="x" title="Antecipar aviso" onclick="antecipar('${p.id}')">⏰</button><button class="x" onclick="delP('${p.id}')">🗑</button></div>
 <div class="lots">${ls.map(x=>{const k=stL(x,p),d=days(x.validade);return `<div class="lot"><span class="d">${x.quantidade} un. · ${fmt(x.validade)} · aviso ${p.aviso_dias} d</span><span class="c ${k}">${d<0?"expirado":d==0?"hoje":d+" d"}</span><button class="x" onclick="delL('${x.id}')">✕</button></div>`}).join("")}</div></div>`}
function prodFiltered(){const q=norm($("#q").value),fc=$("#fc").value,a=$("#pd1").value,b=$("#pd2").value;
 return view().filter(x=>(filter=="all"||x.s==filter)&&norm(x.p.nome).includes(q)&&(!fc||(fc=="__"?!x.p.categoria:x.p.categoria==fc))&&((!a&&!b)||x.ls.some(l=>(!a||l.validade>=a)&&(!b||l.validade<=b))))}
function renderProd(){const v=view(),c={bad:0,warn:0,ok:0};v.forEach(x=>c[x.s]++);
 $("#nb").textContent=c.bad;$("#nw").textContent=c.warn;$("#no").textContent=c.ok;
 document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("on",t.dataset.f==filter));
 const l=prodFiltered();
 $("#list").innerHTML=l.length?l.map(cardHTML).join(""):`<div class="empty">${v.length?"Nada nesta lista.":"Ainda não tens produtos.<br>Toca em <b>+ Produto</b> para registar o primeiro."}</div>`;
 const a=$("#alert");if(c.bad||c.warn){a.className=c.bad?"red":"";a.innerHTML=(c.bad?`<b>${c.bad} produto(s) com lotes expirados.</b> Retira-os do stock. `:"")+(c.warn?`<b>${c.warn} a vencer em breve.</b> Vende ou usa primeiro.`:"")}else a.className="hide"}

$("#q").oninput=renderProd;$("#fc").onchange=renderProd;$("#pd1").onchange=$("#pd2").onchange=renderProd;

const MES={jan:1,fev:2,feb:2,mar:3,abr:4,apr:4,mai:5,may:5,jun:6,jul:7,ago:8,aug:8,set:9,sep:9,out:10,oct:10,nov:11,dez:12,dec:12};
function parseDates(t){t=t.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,"0");const out=new Set(),now=new Date(),lo=new Date(now.getFullYear()-2,0,1),hi=new Date(now.getFullYear()+10,0,1);
 const add=(d,m,y)=>{y=+y;if(y<100)y+=2000;d=+d;m=+m;const dt=new Date(y,m-1,d);if(m<1||m>12||d<1||dt.getMonth()!=m-1||dt<lo||dt>hi)return;out.add(`${y}-${pad(m)}-${pad(d)}`)};
 let r=t;
 r=r.replace(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})\b/g,(x,d,m,y)=>{add(d,m,y);return " "});
 r=r.replace(/(\d{1,2})\s*([A-Za-zÇç]{3})[A-Za-zç]*\s*[\/\-.]?\s*(\d{4}|\d{2})\b/g,(x,d,m,y)=>{const k=MES[m.toLowerCase()];if(k)add(d,k,y);return " "});
 r.replace(/\b(\d{1,2})\s*[\/\-.]\s*(\d{4})\b/g,(x,m,y)=>{if(+m>=1&&+m<=12)add(new Date(+y,+m,0).getDate(),m,y)});return [...out].sort()}

function prep(img){return new Promise(res=>{const m=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*m;c.height=img.height*m;const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.4)";x.drawImage(img,0,0,c.width,c.height);res(c)})}
function loadJs(u,k){return new Promise((ok,no)=>{if(window[k])return ok();const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("Sem internet para carregar a ferramenta."));document.head.append(s)})}

  const ds=parseDates(text.split("\n").filter(x=>!/\b(fab|prod|mfg|manuf)/i.test(x)).join("\n")),nm=guessName(text);

function mkPDF(){const W=595,H=842,pages=[];let cur=null;const D={y:0};
 const enc=s=>String(s).replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"..").replace(/[^\x20-\xFF]/g,"?");
 const esc=s=>enc(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
 const col=c=>c.map(v=>(v/255).toFixed(3)).join(" ");
 D.page=()=>{cur=[];pages.push(cur);D.y=50};
 D.text=(x,y,s,sz=10,b=false,c=[16,35,31])=>cur.push(`BT /F${b?2:1} ${sz} Tf ${col(c)} rg ${x} ${H-y} Td (${esc(s)}) Tj ET`);
 D.rect=(x,y,w,h,c)=>cur.push(`${col(c)} rg ${x} ${H-y-h} ${w} ${h} re f`);
 D.need=h=>{if(D.y+h>H-50)D.page()};
 D.build=()=>{const parts=[],off=[];let len=0;const add=s=>{parts.push(s);len+=s.length};const obj=(n,b)=>{off[n]=len;add(`${n} 0 obj\n${b}\nendobj\n`)};
  pages.forEach((c,i)=>c.push(`BT /F1 8 Tf 0.420 0.500 0.475 rg 40 24 Td (Fresh Keep - pagina ${i+1} de ${pages.length}) Tj ET`));
  const np=pages.length,N=4+np*2;add("%PDF-1.4\n");
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");obj(2,`<</Type/Pages/Kids[${pages.map((_,i)=>(5+i*2)+" 0 R").join(" ")}]/Count ${np}>>`);
  obj(3,"<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>");obj(4,"<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>");
  pages.forEach((c,i)=>{const pn=5+i*2,st=c.join("\n");obj(pn,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${pn+1} 0 R>>`);obj(pn+1,`<</Length ${st.length}>>\nstream\n${st}\nendstream`)});
  const xr=len;add(`xref\n0 ${N+1}\n0000000000 65535 f \n`);for(let i=1;i<=N;i++)add(String(off[i]).padStart(10,"0")+" 00000 n \n");
  add(`trailer\n<</Size ${N+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  const s=parts.join(""),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
 D.page();return D}

function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.18)})}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300])}

 const today=new Date().toDateString();if(!ring&&localStorage.getItem("fk_last")==today)return;localStorage.setItem("fk_last",today);beep();
 try{if("Notification" in window&&Notification.permission=="granted")new Notification("Fresh Keep",{body:`${b} expirado(s) e ${w} a vencer (produtos e documentos). Abre o app para ver.`})}catch(e){}}

async function hardReload(){try{(await caches.keys()).forEach(k=>caches.delete(k));(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister())}catch(e){}setTimeout(()=>location.reload(),300)}
async function checkUpdate(manual){if(!navigator.onLine)return;try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=await r.json();
 if(v.version&&v.version!==APP_VERSION)showUpdate("Nova versão "+v.version+(v.notas?": "+v.notas:""),hardReload);else if(manual)toast("Já tens a versão mais recente.")}catch(e){}}
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{
  reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state=="installed"&&navigator.serviceWorker.controller)showUpdate("Nova versão disponível",()=>w.postMessage("SKIP"))})});
  setInterval(()=>reg.update().catch(()=>{}),30*60*1000)}).catch(()=>{})});
 let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||rl)return;rl=true;location.reload()})}
